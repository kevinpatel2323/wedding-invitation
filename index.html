<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emily &amp; James</title>
<meta name="description" content="The wedding of Emily &amp; James — all functions, timings, venues and directions.">
<meta name="theme-color" content="#fffaf1">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Emily &amp; James — Wedding Invitation">
<meta property="og:description" content="All functions, timings, venues and directions.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@200;300;400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#fffaf1;
  --paper-2:#fdf2df;
  --ink:#3d2314;
  --ink-soft:#6f4b32;
  --ink-faint:#a08165;
  --marigold:#e2891d;
  --vermilion:#b5291f;
  --gold:#c08f32;
  --teal:#15706b;
  --line:rgba(61,35,20,.13);
  --card:#fffdf8;
  --card-edge:rgba(192,143,50,.34);
  --shadow:0 1px 2px rgba(61,35,20,.04),0 14px 32px -20px rgba(61,35,20,.3);
  --maxw:620px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Mukta',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:300;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* warm wash behind everything */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(90% 55% at 50% -8%, rgba(226,137,29,.16), transparent 68%),
    radial-gradient(75% 45% at 8% 104%, rgba(21,112,107,.10), transparent 70%),
    var(--paper-2);
}

/* ───────── toran: the hanging garland across the top ───────── */
.toran{position:sticky;top:0;z-index:5;line-height:0;filter:drop-shadow(0 2px 3px rgba(61,35,20,.12))}
.toran svg{display:block;width:100%;height:30px}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px calc(64px + env(safe-area-inset-bottom))}

/* ───────── hero ───────── */
.hero{position:relative;padding:clamp(34px,9vh,70px) 0 clamp(24px,5vh,38px);text-align:center}
.mandala{
  position:absolute;top:clamp(6px,2vh,26px);left:50%;transform:translateX(-50%);
  width:min(330px,88vw);height:min(330px,88vw);
  color:var(--gold);opacity:.22;pointer-events:none;z-index:0;
}
.hero > *:not(.mandala){position:relative;z-index:1}

.seal{
  width:82px;height:82px;margin:0 auto 22px;
  display:grid;place-items:center;
  border-radius:50% 50% 50% 50%/55% 55% 45% 45%;
  background:var(--card);
  border:1px solid var(--card-edge);
  box-shadow:0 0 0 5px rgba(255,253,248,.72), var(--shadow);
}
.seal span{font-family:'Marcellus',serif;font-size:23px;letter-spacing:.03em;color:var(--vermilion)}

.eyebrow{
  font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 14px;
}
.names{
  font-family:'Marcellus',serif;font-weight:400;
  font-size:clamp(40px,13.5vw,72px);line-height:1.06;letter-spacing:.005em;
  margin:0;color:var(--ink);
}
.amp{
  display:block;font-size:.4em;color:var(--marigold);
  margin:.1em 0;letter-spacing:.14em;text-transform:lowercase;
}
.tagline{
  font-family:'Marcellus',serif;
  font-size:clamp(16px,4.4vw,20px);color:var(--ink-soft);
  margin:20px auto 0;max-width:30ch;line-height:1.5;
}

.divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:26px auto 0;max-width:280px}
.divider i{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
.divider svg{width:30px;height:16px;color:var(--marigold);flex:none}

.countdown{margin:26px 0 0;display:flex;justify-content:center;gap:0}
.cd{min-width:60px;padding:0 clamp(6px,2.4vw,12px);position:relative}
.cd+.cd::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:1px;background:var(--line)}
.cd b{
  display:block;font-family:'Marcellus',serif;font-weight:400;
  font-size:clamp(25px,7vw,31px);line-height:1.12;font-variant-numeric:tabular-nums;color:var(--vermilion);
}
.cd small{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-faint)}

/* ───────── events ───────── */
.section-label{
  text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-faint);margin:6px 0 24px;
}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:14px}

.card{
  position:relative;
  border:1px solid var(--card-edge);
  border-radius:26px 26px 18px 18px;
  background:var(--card);
  box-shadow:var(--shadow);
  padding:18px 16px 14px;
  transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s, border-color .25s;
  -webkit-tap-highlight-color:transparent;
}
/* a thin inner keyline, like a printed card */
.card::before{
  content:"";position:absolute;inset:4px;border-radius:22px 22px 14px 14px;
  border:1px solid rgba(192,143,50,.16);pointer-events:none;
}
.card:hover,.card:focus-within{
  transform:translateY(-3px);
  border-color:rgba(192,143,50,.7);
  box-shadow:0 1px 2px rgba(61,35,20,.05),0 22px 42px -22px rgba(61,35,20,.4);
}
.card:active{transform:translateY(-1px) scale(.995)}
.cardlink{display:block;text-decoration:none;color:inherit}
.cardlink::after{content:"";position:absolute;inset:0;border-radius:26px 26px 18px 18px}
.cardlink:focus-visible::after{outline:2px solid var(--marigold);outline-offset:3px}

.card-top{display:flex;align-items:flex-start;gap:13px}
.glyph{
  flex:none;width:44px;height:44px;display:grid;place-items:center;
  border-radius:50% 50% 14% 14%;            /* temple-arch silhouette */
  background:color-mix(in srgb, var(--accent) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 34%, transparent);
  color:var(--accent);
}
.glyph svg{width:21px;height:21px}
.card:nth-child(6n+1){--accent:var(--marigold)}
.card:nth-child(6n+2){--accent:var(--teal)}
.card:nth-child(6n+3){--accent:var(--vermilion)}
.card:nth-child(6n+4){--accent:var(--gold)}
.card:nth-child(6n+5){--accent:var(--marigold)}
.card:nth-child(6n+6){--accent:var(--teal)}

.card h2{
  font-family:'Marcellus',serif;font-weight:400;
  font-size:clamp(21px,5.6vw,25px);line-height:1.18;margin:0;
}
.sub{
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin:4px 0 0;font-weight:400;
}
.when{
  margin:13px 0 0;padding-top:12px;border-top:1px dashed var(--line);
  display:grid;gap:7px;font-size:14.5px;color:var(--ink-soft);
}
.when > div{display:flex;gap:9px;align-items:flex-start;min-width:0}
.when svg{width:14px;height:14px;flex:none;margin-top:5px;color:var(--ink-faint)}
.when span{min-width:0;overflow-wrap:anywhere}
.when b{font-weight:500;color:var(--ink)}
.venue-note{font-size:13px;color:var(--ink-faint);line-height:1.5}

.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-top:12px;
}
.cal{
  position:relative;z-index:1;
  display:inline-flex;align-items:center;gap:7px;
  min-height:40px;padding:8px 14px 8px 12px;border-radius:999px;
  font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);background:none;border:1px solid var(--line);cursor:pointer;
  transition:color .2s,border-color .2s;
}
.cal:hover{color:var(--accent);border-color:color-mix(in srgb, var(--accent) 45%, transparent)}
.cal:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.cal svg{width:13px;height:13px}
.go{
  display:flex;align-items:center;gap:7px;margin-left:auto;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
}
.go svg{width:13px;height:13px;transition:transform .25s}
.card:hover .go svg{transform:translateX(3px)}

/* ───────── footer ───────── */
.foot{text-align:center;margin-top:44px}
.foot .divider{margin-bottom:20px}
.hashtag{font-family:'Marcellus',serif;font-size:19px;color:var(--vermilion);margin:0}
.foot p.note{font-size:12.5px;color:var(--ink-faint);margin:10px 0 0}

@media (prefers-reduced-motion: no-preference){
  .reveal{opacity:0;transform:translateY(16px);animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
}
@media (max-width:360px){
  .wrap{padding-left:13px;padding-right:13px}
  .card{padding:16px 13px 12px}
  .card-foot{gap:8px}
  .cal{letter-spacing:.1em;padding:8px 11px}
}
</style>
</head>

<script>
/* ════════════════════════════════════════════════════════════════════
   EDIT EVERYTHING HERE.  All values below are placeholders.
   lat / lng  →  open Google Maps, right-click the venue, copy the
                 two numbers it shows, paste them in that order.
   date       →  YYYY-MM-DD      start / end  →  HH:MM  (24-hour)
   icon       →  leaf | diya | henna | music | rings | glass
   ════════════════════════════════════════════════════════════════════ */
const WEDDING = {
  nameA: "Emily",
  nameB: "James",
  monogram: "E & J",
  tagline: "invite you to celebrate the days that make us one",
  hashtag: "#EmilyAndJames",
  timeZone: "America/New_York",
  mainEventId: "wedding",          // the event the countdown points at

  events: [

      venue: "The Harper Residence",
      address: "14 Maple Court, Edison, NJ 08820",
      lat: 40.5187, lng: -74.4121,
      note: "Family only · Traditional Indian attire"
    },
    {
      id: "mehndi",
      name: "Mehndi",
      subtitle: "Henna & high tea",
      icon: "henna",

      lat: 40.5751, lng: -74.3232,

    },
    {

      subtitle: "A night of music",
      icon: "music",
      date: "2027-06-11", start: "19:30", end: "23:30",
      venue: "Grand Ballroom, Hotel Meridian",
      address: "1500 Riverside Drive, Woodbridge, NJ 07095",
      lat: 40.5576, lng: -74.2846,

    },
    {
      id: "haldi",
      name: "Haldi",
      subtitle: "Turmeric & laughter",
      icon: "leaf",
      date: "2027-06-12", start: "10:00", end: "12:30",
      venue: "Poolside Courtyard, Hotel Meridian",
      address: "1500 Riverside Drive, Woodbridge, NJ 07095",
      lat: 40.5576, lng: -74.2846,
      note: "Wear something you don't mind staining yellow"
    },
    {
      id: "wedding",
      name: "The Wedding",
      subtitle: "Vivaah · the vows",

};
/* ═══════════════════ nothing below needs editing ═══════════════════ */

const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, "0");

$("#monogram").textContent = WEDDING.monogram;
$("#name-a").textContent = WEDDING.nameA;
$("#name-b").textContent = WEDDING.nameB;
$("#tagline").textContent = WEDDING.tagline;
$("#hashtag").textContent = WEDDING.hashtag;
document.title = WEDDING.nameA + " & " + WEDDING.nameB;

/* Build a Date from the event's own fields, interpreted in the wedding's
   time zone, so the countdown is right no matter where a guest is. */
function eventDate(e, which) {
  const [y, m, d] = e.date.split("-").map(Number);
  const [hh, mm] = (which === "end" ? e.end : e.start).split(":").map(Number);
  const guess = Date.UTC(y, m - 1, d, hh, mm);
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: WEDDING.timeZone, hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit"
  });
  const p = {};
  for (const part of fmt.formatToParts(new Date(guess))) p[part.type] = part.value;
  const asZone = Date.UTC(+p.year, p.month - 1, +p.day, +p.hour % 24, +p.minute);
  return new Date(guess - (asZone - guess));
}

function fmtDate(e) {
  return eventDate(e).toLocaleDateString(undefined, {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
    timeZone: WEDDING.timeZone
  });
}
function fmtTime(e) {
  const t = (d) => d.toLocaleTimeString(undefined, {
    hour: "numeric", minute: "2-digit", timeZone: WEDDING.timeZone
  });
  return e.end ? t(eventDate(e)) + " – " + t(eventDate(e, "end")) : t(eventDate(e));
}

/* Google Maps for everyone. The plain https link hands off to the Google
   Maps app when it is installed and falls back to the browser when not. */
function mapsHref(e) {
  return "https://www.google.com/maps/dir/?api=1&destination=" + e.lat + "," + e.lng;
}

const list = $("#events");
WEDDING.events.forEach((e, i) => {
  const li = document.createElement("li");
  li.className = "card reveal";
  li.style.animationDelay = (0.5 + i * 0.07).toFixed(2) + "s";
  li.innerHTML = `
    <a class="cardlink" href="${mapsHref(e)}" target="_blank" rel="noopener"
       aria-label="${e.name} — directions to ${e.venue}">
      <div class="card-top">
        <span class="glyph" aria-hidden="true"><svg><use href="#i-${e.icon}"/></svg></span>
        <div>
          <h2>${e.name}</h2>
          <p class="sub">${e.subtitle}</p>
        </div>
      </div>
      <div class="when">
        <div><svg aria-hidden="true"><use href="#i-cal"/></svg><span><b>${fmtDate(e)}</b></span></div>
        <div><svg aria-hidden="true"><use href="#i-clock"/></svg><span>${fmtTime(e)}</span></div>
        <div><svg aria-hidden="true"><use href="#i-pin"/></svg><span><b>${e.venue}</b><br>
          <span class="venue-note">${e.address}</span></span></div>
      </div>
      ${e.note ? `<p class="venue-note" style="margin:11px 0 0">${e.note}</p>` : ""}
    </a>
    <div class="card-foot">
      <button class="cal" type="button" data-i="${i}">
        <svg aria-hidden="true"><use href="#i-cal"/></svg> Add to calendar
      </button>
      <div class="go" aria-hidden="true">Navigate <svg><use href="#i-arrow"/></svg></div>
    </div>`;
  list.appendChild(li);
});

/* One-click .ics — generated in the browser, no server involved. */
function icsStamp(d) {
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate())
       + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
}
list.addEventListener("click", (ev) => {
  const btn = ev.target.closest(".cal");
  if (!btn) return;
  const e = WEDDING.events[btn.dataset.i];
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//wedding//EN", "BEGIN:VEVENT",
    "UID:" + e.id + "@wedding",
    "DTSTAMP:" + icsStamp(new Date()),
    "DTSTART:" + icsStamp(eventDate(e)),
    "DTEND:" + icsStamp(eventDate(e, e.end ? "end" : "start")),
    "SUMMARY:" + e.name + " — " + WEDDING.nameA + " & " + WEDDING.nameB,
    "LOCATION:" + (e.venue + ", " + e.address).replace(/,/g, "\\,"),
    "DESCRIPTION:" + (e.note || "").replace(/,/g, "\\,"),
    "GEO:" + e.lat + ";" + e.lng,
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = e.id + ".ics";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* Countdown */
const main = WEDDING.events.find((e) => e.id === WEDDING.mainEventId) || WEDDING.events[0];
const target = eventDate(main);
const cdEl = $("#countdown");
function tick() {
  const ms = target - Date.now();
  if (ms <= 0) {
    cdEl.innerHTML = `<div class="cd" style="min-width:auto"><b style="font-size:24px">Today is the day</b></div>`;
    return;
  }
  const s = Math.floor(ms / 1000);
  const units = [
    [Math.floor(s / 86400), "days"],
    [Math.floor(s / 3600) % 24, "hours"],
    [Math.floor(s / 60) % 60, "mins"],
    [s % 60, "secs"]
  ];
  cdEl.innerHTML = units.map(([v, l]) => `<div class="cd"><b>${pad(v)}</b><small>${l}</small></div>`).join("");
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
